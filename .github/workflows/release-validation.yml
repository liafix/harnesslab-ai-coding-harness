name: HarnessLab Release Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full release validation
        run: npm run validate

      - name: Runtime dependency security gate
        run: |
          for i in {1..5}; do
            npm audit --omit=dev --audit-level=high && exit 0
            echo "npm audit failed (attempt $i/5), retrying in 10 seconds..."
            sleep 10
          done
          exit 1
